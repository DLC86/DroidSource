name: Fetch scrcpy Binary
description: Download patched scrcpy from wtarit/scrcpy GitHub Release into data/bin/

inputs:
  platform:
    description: 'Release asset platform slug (win64, linux-x86_64, macos-aarch64)'
    required: true
  format:
    description: 'Archive format (zip or tar.gz)'
    required: true

runs:
  using: composite
  steps:
    - name: Download and extract scrcpy
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SCRCPY_VERSION=$(git -C scrcpy describe --tags --exact-match)
        echo "Downloading scrcpy ${SCRCPY_VERSION} for ${{ inputs.platform }}..."

        ASSET_NAME="scrcpy-${{ inputs.platform }}-${SCRCPY_VERSION}.${{ inputs.format }}"

        gh release download "${SCRCPY_VERSION}" \
          --repo wtarit/scrcpy \
          --pattern "${ASSET_NAME}" \
          --dir "${RUNNER_TEMP}"

        mkdir -p data/bin

        if [[ "${{ inputs.format }}" == "zip" ]]; then
          unzip -o "${RUNNER_TEMP}/${ASSET_NAME}" -d "${RUNNER_TEMP}/scrcpy-extracted"
        else
          mkdir -p "${RUNNER_TEMP}/scrcpy-extracted"
          tar -xzf "${RUNNER_TEMP}/${ASSET_NAME}" -C "${RUNNER_TEMP}/scrcpy-extracted"
        fi

        EXTRACTED_DIR=$(find "${RUNNER_TEMP}/scrcpy-extracted" -mindepth 1 -maxdepth 1 -type d | head -1)
        cp -r "${EXTRACTED_DIR}/." data/bin/

        echo "data/bin contents:"
        ls -la data/bin/

    - name: Set up JDK 17 for Android build
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Configure Android SDK for patched camera server
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkRoot = $env:ANDROID_SDK_ROOT
        if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_HOME }
        if (-not $sdkRoot) { $sdkRoot = 'C:\Android\android-sdk' }
        "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV
        "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
        $platform = Join-Path $sdkRoot 'platforms\android-36\android.jar'
        $buildTools = Join-Path $sdkRoot 'build-tools\36.0.0\d8.bat'
        if (-not (Test-Path $platform)) { throw "Android platform android-36 not installed: $platform" }
        if (-not (Test-Path $buildTools)) { throw "Android build-tools 36.0.0 not installed: $buildTools" }
        Write-Host "Using Android SDK: $sdkRoot"
        Write-Host "Android platform and build-tools are present."
    - name: Build patched scrcpy Android server
      shell: bash
      run: |
        set -e
        python tools/patch-scrcpy-camera.py
        # Android build-tools 36 on the Windows runner does not resolve the
        # relative AIDL import path used by scrcpy 4.0. Use an absolute path.
        python -c 'from pathlib import Path; p=Path("scrcpy/server/build_without_gradle.sh"); s=p.read_text(encoding="utf-8"); s=s.replace("-I. \\", "-I\\"$SERVER_DIR/src/main/aidl\\" \\"); p.write_text(s, encoding="utf-8")'
        rm -rf "${RUNNER_TEMP}/scrcpy-server-build"
        BUILD_DIR="${RUNNER_TEMP}/scrcpy-server-build" bash scrcpy/server/build_without_gradle.sh
        cp "${RUNNER_TEMP}/scrcpy-server-build/scrcpy-server" data/bin/scrcpy-server
        echo "Patched scrcpy-server installed:"
        ls -l data/bin/scrcpy-server
