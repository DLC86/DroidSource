name: Build macOS
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}

jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check GitHub Event Data ☑️
        id: setup
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              config_data=('package:false' 'config:RelWithDebInfo')
              ;;
            push)
              config_data=('package:true' 'config:RelWithDebInfo')
              if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta).+)?$ ]]; then
                config_data[1]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "$config"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> "$GITHUB_OUTPUT"

          plugin_name="$(jq -r '.name' buildspec.json)"
          plugin_display_name="$(jq -r '.displayName // empty' buildspec.json)"
          if [[ -n "$plugin_display_name" ]]; then
            echo "pluginName=$plugin_display_name" >> "$GITHUB_OUTPUT"
          else
            echo "pluginName=$plugin_name" >> "$GITHUB_OUTPUT"
          fi

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin OBS 32.2.2 dependencies 🔒
        shell: bash
        run: |
          set -euo pipefail

          obs_version="32.2.2"
          deps_version="2026-08-26"
          obs_archive="$RUNNER_TEMP/obs-studio-$obs_version.tar.gz"
          obs_url="https://github.com/obsproject/obs-studio/archive/refs/tags/$obs_version.tar.gz"

          curl -L --fail --retry 3 "$obs_url" -o "$obs_archive"
          obs_hash="$(shasum -a 256 "$obs_archive" | awk '{print $1}')"
          echo "OBS 32.2.2 source ZIP SHA-256: $obs_hash"

          jq \
            --arg v "$obs_version" \
            --arg obs_hash "$obs_hash" \
            --arg d "$deps_version" \
            --arg prebuilt_hash "166560b13be8deb9a1aa7bfd306377a92c3817cecace931fe9732b9a25f0a97a" \
            --arg qt_hash "1f69dcfcdd71f6e319d89736de0290a366fe5d161eae692c6818d20fdfa95c25" \
            '.dependencies["obs-studio"].version=$v
             | .dependencies["obs-studio"].hashes.macos=$obs_hash
             | .dependencies.prebuilt.version=$d
             | .dependencies.prebuilt.hashes.macos=$prebuilt_hash
             | .dependencies.qt6.version=$d
             | .dependencies.qt6.hashes.macos=$qt_hash' \
            buildspec.json > "$RUNNER_TEMP/buildspec.json"
          mv "$RUNNER_TEMP/buildspec.json" buildspec.json

      - name: Set Up Environment 🔧
        id: setup
        run: |
          read -r product_name product_version <<< "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"
          print "pluginName=$product_name" >> "$GITHUB_OUTPUT"
          print "pluginVersion=$product_version" >> "$GITHUB_OUTPUT"

      - name: Fetch scrcpy Binary 📦
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scrcpy_version="$(git -C scrcpy describe --tags --exact-match)"
          asset_name="scrcpy-macos-aarch64-$scrcpy_version.tar.gz"

          curl -L --fail --retry 3 \
            "https://github.com/wtarit/scrcpy/releases/download/$scrcpy_version/$asset_name" \
            -o "$RUNNER_TEMP/$asset_name"

          mkdir -p data/bin
          rm -rf "$RUNNER_TEMP/scrcpy-extracted"
          mkdir -p "$RUNNER_TEMP/scrcpy-extracted"
          tar -xzf "$RUNNER_TEMP/$asset_name" -C "$RUNNER_TEMP/scrcpy-extracted"
          extracted_dir="$(find "$RUNNER_TEMP/scrcpy-extracted" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$extracted_dir"
          cp -r "$extracted_dir/." data/bin/
          chmod +x data/bin/scrcpy

      - name: Set up JDK 8 for scrcpy server
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Save JDK 8 path
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 17 for scrcpy server
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK for patched scrcpy server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_SDK_ROOT:-}" ]]; then
            if [[ -n "${ANDROID_HOME:-}" ]]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            elif [[ -d "$HOME/Library/Android/sdk" ]]; then
              export ANDROID_SDK_ROOT="$HOME/Library/Android/sdk"
            else
              echo "::error::Android SDK root was not found."
              exit 1
            fi
          fi
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          test -x "$sdkmanager"

          yes | "$sdkmanager" --licenses >/dev/null || true
          if [[ ! -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" || ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/d8" ]]; then
            "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi

          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/d8"

      - name: Build patched scrcpy Android server
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch-scrcpy-camera.py
          export JAVAC="$JAVA8_HOME/bin/javac"
          export JAVA8_RT_JAR="$JAVA8_HOME/jre/lib/rt.jar"
          test -x "$JAVAC"
          test -f "$JAVA8_RT_JAR"
          rm -rf "$RUNNER_TEMP/scrcpy-server-build"
          mkdir -p "$RUNNER_TEMP/scrcpy-server-build"
          BUILD_DIR="$RUNNER_TEMP/scrcpy-server-build" bash scrcpy/server/build_without_gradle.sh
          cp "$RUNNER_TEMP/scrcpy-server-build/scrcpy-server" data/bin/scrcpy-server

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: false

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: false
          notarize: false

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal*.*
