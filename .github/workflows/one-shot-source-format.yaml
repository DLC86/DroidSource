name: One-shot source formatter
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply final clang-format'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install clang-format-19
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
      - name: Format source
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin:$PATH"
          clang-format-19 --style=file --fallback-style=none -i src/scrcpy-source.c
      - name: Commit and remove
        run: |
          rm .github/workflows/one-shot-source-format.yaml
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scrcpy-source.c .github/workflows/one-shot-source-format.yaml
          git commit -m "Apply final clang-format"
          git push origin HEAD:master
