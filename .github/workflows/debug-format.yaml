name: Debug clang-format
on:
  push:
    branches: [master]
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
      - name: Show formatted diff
        shell: bash
        run: |
          /home/linuxbrew/.linuxbrew/opt/clang-format@19/bin/clang-format --style=file --fallback-style=none src/scrcpy-reader.c > /tmp/scrcpy-reader.c
          diff -u src/scrcpy-reader.c /tmp/scrcpy-reader.c || true
