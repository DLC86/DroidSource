name: Debug clang-format
on:
  push:
    branches: [master]
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
      - name: Show formatted diff
        shell: bash
        run: |
          formatter=$(find /home/linuxbrew/.linuxbrew -type f -name 'clang-format*' 2>/dev/null | head -1)
          echo "formatter=$formatter"
          "$formatter" --version
          "$formatter" --style=file --fallback-style=none src/scrcpy-reader.c > /tmp/scrcpy-reader.c
          diff -u src/scrcpy-reader.c /tmp/scrcpy-reader.c || true
