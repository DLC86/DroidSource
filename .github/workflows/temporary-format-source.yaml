name: Temporary source formatter

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-format scrcpy source') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format-19
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19

      - name: Format source
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export PATH="/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin:$PATH"
          clang-format-19 -style=file -fallback-style=none -i src/scrcpy-source.c
          if git diff --quiet -- src/scrcpy-source.c; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scrcpy-source.c
          git commit -m "Auto-format scrcpy source"
          git push
