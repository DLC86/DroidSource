name: Debug clang-format artifact
on:
  push:
    branches: [master]
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
      - name: Generate formatted source
        shell: bash
        run: |
          clang-format-19 --version
          clang-format-19 --style=file --fallback-style=none src/scrcpy-reader.c > /tmp/scrcpy-reader.c
          cp /tmp/scrcpy-reader.c ./scrcpy-reader.formatted.c
      - name: Upload formatted source
        uses: actions/upload-artifact@v5
        with:
          name: formatted-reader
          path: scrcpy-reader.formatted.c
